<!doctype html>
<html>
<head>
  <title>Arvutamise graafiline abiline</title>
  <style>
    body  { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    .box  { border: 1px solid #999; background: #fff; padding: 16px;
            display: inline-block; width: 520px; }
    canvas { display: block; margin-bottom: 16px; }
    .controls { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .row  { display: flex; align-items: center; gap: 8px; }
    .lbl  { min-width: 70px; }
    input[type=range] { width: 200px; }
    .val  { min-width: 60px; font-weight: 500; }
  </style>
  <script src="voimsus.js"></script>
</head>
<body onload="startPage()">
  <p style="font-size:14px; margin-bottom:8px;">Arvutamise graafiline abiline:</p>
  <div class="box">
    <canvas id="canvas1" width="520" height="100"></canvas>
    <div class="controls">
      <div class="row">
        <span class="lbl">Takistus:</span>
        <input type="range" id="sliderR" min="10" max="1000" value="110" step="10">
        <span class="val" id="labelR">110 Ω</span>
      </div>
      <div class="row">
        <span class="lbl">Pinge:</span>
        <input type="range" id="sliderU" min="0" max="24" value="0" step="0.5">
        <span class="val" id="labelU">0.0 V</span>
      </div>
    </div>
  </div>
</body>
</html>
